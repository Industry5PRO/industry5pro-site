<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>

  <!-- 0-delay HTML redirect -->
  <meta http-equiv="refresh" content="0; url=/industry5pro-site/aiot/">

  <!-- Helpful for crawlers and link previews -->
  <link rel="canonical" href="https://industry5.pro/industry5pro-site/aiot/" />

  <!-- Basic mobile meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#000;color:#fff}
    .wrap{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
    a{color:#85BB65}
  </style>
  <script>
    // JS redirect (in case meta refresh is blocked)
    (function(){
      var target = "/industry5pro-site/aiot/";
      if (location.pathname !== target) {
        // replace() avoids keeping the intermediate page in history
        location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Taking you to AIoT…</h1>
      <p>If you’re not redirected, <a href="/industry5pro-site/aiot/">click here</a>.</p>
    </div>
  </div>
</body>
</html>
