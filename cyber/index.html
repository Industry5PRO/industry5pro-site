<script>
    document.getElementById('y').textContent = new Date().getFullYear();
    
    // Cyber quadrant script
    (function () {
      const points = [
        // --- THE LEADERS (Top Right) ---
        // Merged "Defender" and "Network" into one Powerhouse Node
        // High Integration (MSFT + Network) & High Security (Black Lotus)
        { name: "Lumen Platform (Net + MSFT)", x: 88, y: 86, vendor: "lumen" }, 
        
        // Commvault anchors the Recovery story
        { name: "Commvault (Recovery)",       x: 82, y: 89, vendor: "commvault" },

        // --- STRONG SECURITY / LOWER INTEGRATION (Top Left) ---
        // Great tools, but they are "Islands" (Agents only)
        { name: "CrowdStrike / S1",           x: 62, y: 88, vendor: "default" }, 
        { name: "Red Canary (MDR)",           x: 70, y: 82, vendor: "default" }, 
        { name: "Expel (MDR)",                x: 68, y: 80, vendor: "default" }, 
        { name: "Zscaler (SASE)",             x: 64, y: 84, vendor: "default" },

        // --- BACKUP COMPETITORS (Middle) ---
        { name: "Cohesity",                   x: 72, y: 76, vendor: "default" },
        { name: "Rubrik",                     x: 70, y: 79, vendor: "default" },

        // --- LEGACY / OTHER ---
        { name: "Legacy MSSP",                x: 50, y: 60, vendor: "default" }
      ];

      const xMin = 40, xMax = 95; // Expanded range slightly
      const yMin = 50, yMax = 95;

      const grid = document.querySelector(".quadrant-grid");
      if (!grid) return;

      points.forEach(p => {
        const left = (p.x - xMin) / (xMax - xMin) * 100;
        const top  = (1 - (p.y - yMin) / (yMax - yMin)) * 100;

        const wrapper = document.createElement("div");
        wrapper.className = "quad-point";
        wrapper.dataset.vendor = p.vendor || "default";
        wrapper.style.left = left + "%";
        wrapper.style.top  = top + "%";

        const marker = document.createElement("div");
        marker.className = "quad-marker";

        const label = document.createElement("div");
        label.className = "quad-label";
        label.textContent = p.name;

        wrapper.appendChild(marker);
        wrapper.appendChild(label);
        grid.appendChild(wrapper);
      });
    })();

    // KPI Ticker Animation (Preserved)
    document.addEventListener("DOMContentLoaded", () => {
      const kpiCounters = document.querySelectorAll(".knum[data-target]");
      if (!kpiCounters.length) return;

      const animateCounters = (entries, observer) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          
          const counter = entry.target;
          const target = +counter.dataset.target;
          const decimals = counter.dataset.decimals ? +counter.dataset.decimals : 0;
          const duration = 1500;
          const stepTime = 30;
          const steps = Math.ceil(duration / stepTime);
          const increment = target / steps;
          let current = 0;

          const updateCount = () => {
            current += increment;
            let val = (current >= target) ? target : current;
            let valStr = decimals > 0 && val < 1 ? val.toFixed(decimals) : (decimals === 0 ? Math.ceil(val).toString() : val.toFixed(decimals));

            counter.textContent = counter.textContent.startsWith('$') ? `$${valStr}` : valStr;
            if (counter.dataset.suffix) counter.textContent += counter.dataset.suffix;
            if (current < target) requestAnimationFrame(updateCount);
          };
          updateCount();
          observer.unobserve(counter);
        });
      };

      const observer = new IntersectionObserver(animateCounters, { root: null, threshold: 0.5 });
      kpiCounters.forEach(c => observer.observe(c));
    });

    // Checklist Download Script (Preserved)
    (function(){
      const btn = document.getElementById('download-checklist');
      if(!btn) return;

      btn.addEventListener('click', function(){
        const checks = Array.from(document.querySelectorAll('.check input'));
        if (!checks.length) return;

        let content = "Cyber Resilience Checklist - Industry5.pro\n\n";
        const met  = [];
        const gaps = [];

        checks.forEach(c => {
          const label = c.nextElementSibling.innerText.replace('\n', ' - ');
          const status = c.checked ? "[x]" : "[ ]";
          (c.checked ? met : gaps).push(`  • ${status} ${label}`);
        });

        const now = new Date();
        const dt  = now.toLocaleString([], {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
        
        content += `CHECKED (MET) ✅\n${met.length > 0 ? met.join('\n') : "  • (none)"}\n\n`;
        content += `UNCHECKED (GAPS) ❌\n${gaps.length > 0 ? gaps.join('\n') : "  • (none)"}\n\n`;
        content += `Generated: ${dt}\n`;
        content += `Tip: Turn Gaps Into a Plan → industry5.pro/cyber\n`;

        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        const stamp = now.toISOString().slice(0,10);
        a.href = URL.createObjectURL(blob);
        a.download = `My_Cyber_Resilience_Checklist_${stamp}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(a.href), 1200);
      });
    })();
  </script>
