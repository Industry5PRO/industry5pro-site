  <!-- === SEO === -->
  <title>Cyber Resilience & Ransomware Recovery Advisory | Industry5.pro</title>
  <meta name="description" content="Agnostic cyber resilience. We audit your stack and align Lumen network defense with Veeam immutable backups to guarantee recovery. Stop threats, pass audits, and recover in minutes.">
  <meta name="color-scheme" content="dark">

  <!-- === Favicons === -->
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

  <!-- === MASTER HEADER STYLES (Cyber Variant) === -->
  <style id="master-header-cyber">
    :root {
      --header-h: 76px;
      --veeam-green: #00B336; /* Page Accent */
      --lumen-charcoal: #1B1B1D;
      --ice-blue: #2BEDE7;
      --lumen-orange: #FF6A13;
    }
    
    body { 
      padding-top: var(--header-h) !important; 
      background-color: var(--lumen-charcoal);
      color: #EAEAEA;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial; /* Matching other pages */
      margin: 0;
      box-sizing: border-box;
    }
    *, *:before, *:after { box-sizing: inherit; }
    main, .hero, .page-start { margin-top: 0 !important; }

    /* TOPBAR */
    .topbar {
      position: fixed !important;
      top: 0; left: 0; right: 0;
      z-index: 99999 !important;
      height: var(--header-h);
      background: rgba(27,27,29,0.95) !important;
      backdrop-filter: saturate(140%) blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      overflow: visible !important;
    }
    .topbar .wrap {
      width: 100%;
      max-width: 1180px; /* Wider wrap for this page */
      margin: 0 auto;
      padding: 0 24px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav { display: flex; align-items: center; width: 100%; height: 100%; }

    /* BRAND (Veeam Glow) */
    .topbar .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      flex-shrink: 0;
      margin-right: 30px !important; /* Spacing for no-divider look */
    }
    .topbar .brand .logo {
      height: 55px !important;
      width: 55px !important;
      display: block !important;
      object-fit: contain;
      background: transparent !important;
      box-shadow: none !important;
      filter: drop-shadow(0 0 8px rgba(0,179,54,0.6)) !important; /* VEEAM GREEN GLOW */
      transition: filter 0.3s ease;
    }
    .topbar .brand .logo:hover {
      filter: drop-shadow(0 0 16px rgba(0,179,54,1)) !important;
    }
    .topbar .brand strong {
      font-size: 18px;
      font-weight: 800 !important;
      color: #e8eef9 !important;
      white-space: nowrap;
      text-shadow: none !important;
    }

    /* NAV ACTIONS (No Divider Line) */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 24px; /* Wider gap */
      height: 44px;
      border-left: none !important; /* NO DIVIDER */
      padding-left: 0 !important;   
      padding-right: 10px !important; 
      flex-grow: 1;
      justify-content: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav-actions::-webkit-scrollbar { display: none; }

    /* NAV LINKS (Veeam Hover) */
    .topbar .navlink {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff !important;
      font-weight: 800 !important;
      font-size: 14px;
      text-decoration: none;
      line-height: 1.2 !important;
      white-space: normal !important; /* Allows <br> to work */
      padding: 4px 0;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    
    /* HOVER: Force Veeam Green */
    .topbar .navlink:hover,
    .topbar .navlink:focus-visible,
    .topbar .navlink[aria-current="page"] {
      color: var(--veeam-green) !important;
      transform: translateY(-1px);
      text-shadow: 0 0 10px rgba(0,179,54,0.75), 0 0 20px rgba(0,179,54,0.45) !important;
      outline: 0;
    }

    .topbar .navlink::before, .topbar .navlink::after { 
      content: none !important; display: none !important; 
    }
    
    @media (max-width: 900px) {
      .topbar .brand strong { display: none; } 
      .nav-actions { gap: 16px; padding-left: 16px !important; }
    }
  </style>
