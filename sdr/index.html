<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <title>AI SDR - Coming Soon | Industry5.pro</title>
  <meta name="description" content="AI SDR is coming soon to Industry5.pro. Reimagine outbound sales with AI-powered engagement designed for the enterprise.">
  <meta name="author" content="Industry5.pro">
  <link rel="canonical" href="https://industry5.pro/ai-sdr">

  <meta property="og:type" content="website">
  <meta property="og:title" content="AI SDR - Coming Soon">
  <meta property="og:description" content="Reimagine outbound sales with AI-powered engagement designed for the enterprise.">
  <meta property="og:url" content="https://industry5.pro/ai-sdr">
  <meta property="og:image" content="https://industry5.pro/assets/industry5-social.png">

  <meta name="color-scheme" content="dark">

  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

  <style>
    /* --- CORE VARIABLES --- */
    :root {
      --bg: #1B1B1D;
      --panel: #232326;
      --card-bg: #1B1B1D; 
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #e8eef9;
      --text-muted: #aeb8c4;
      --line: rgba(255,255,255,0.08);
      --outline: #2C2C30;
      --accent: #FFD700; /* Gold for AI SDR */
      --accent-glow: rgba(255,215,0,0.6);
    }
    
    /* --- RESET & BASE --- */
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial; box-sizing: border-box;}
    *, *:before, *:after { box-sizing: inherit; }
    a{color:inherit;text-decoration:none;transition:color .2s ease;}
    a:hover{text-decoration:none;}
    img{max-width:100%;display:block}
    button{font-family:inherit;}
    section{padding:42px 0;border-top:1px solid var(--outline)}
    section:first-of-type { border-top: none; }
    .anchor{scroll-margin-top:90px}

    /* --- MASTER HEADER & NAV --- */
    header {
      position: sticky; top: 0; z-index: 99999;
      background: linear-gradient(180deg,rgba(27,27,29,0.95),rgba(27,27,29,0.85));
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    
    .header-center {
      max-width: 1100px; 
      margin: 0 auto; 
      padding: 14px 18px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 20px; 
    }

    /* Branding */
    .brand { display: flex; align-items: center; gap: 16px; text-decoration: none; flex-shrink: 0; }
    
    /* LOGO: 75px + AI SDR GOLD GLOW */
    .brand img.logo {
      width: 75px !important; height: 75px !important; 
      border-radius: 14px; display: block; object-fit: contain; 
      background: transparent;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.5));
      transition: filter 0.3s ease;
    }
    .brand:hover img.logo { filter: drop-shadow(0 0 14px rgba(255,215,0,0.9)); }
    
    .brand .title {
      font-weight: 800; 
      font-size: 26px; 
      color: #fff; line-height: 1; letter-spacing: 0.2px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, 'Helvetica Neue', Arial;
    }

    /* Navigation */
    .main-nav { 
      display: flex; gap: 20px; align-items: center; flex-wrap: wrap; 
      justify-content: flex-end; 
    }

    /* Nav Links */
    .main-nav a {
      position: relative; color: #cfe3d4; 
      font-weight: 500; 
      font-size: 0.85rem; 
      line-height: 1.2; text-align: center; display: inline-flex; 
      align-items: center; justify-content: center;
      transition: color .15s ease, text-shadow .15s ease;
    }

    /* Page Specific Active State (AI SDR) */
    .main-nav a.active {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255,215,0,0.6);
    }

    /* Hover Effects */
    .main-nav a:not(.nav-sdr):hover {
      color: var(--accent); /* Gold Hover */
      text-shadow: 0 0 6px rgba(255,215,0,0.85), 0 0 14px rgba(255,215,0,0.45);
    }

    /* Underline Animation */
    .main-nav a:not(.nav-sdr)::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 2px;
      background: var(--accent); 
      transform: scaleX(0); transform-origin: left; 
      transition: transform .25s ease;
    }
    .main-nav a:not(.nav-sdr):hover::after { transform: scaleX(1); }
    .main-nav a.active::after { transform: scaleX(1); }

    /* --- AI SDR SPECIAL BUTTON --- */
    .main-nav a.nav-sdr {
      color: #fff !important;
      font-weight: 800;
      text-transform: uppercase;
      border: none;
      background: transparent;
      padding: 6px 4px;
      transition: all 0.25s ease;
    }
    
    .main-nav a.nav-sdr:hover {
      color: var(--accent) !important;
      text-shadow: 0 0 10px rgba(255,215,0,0.8);
      transform: translateY(-1px);
    }

    @media (max-width: 1100px) {
      .header-center { flex-direction: column; align-items: flex-start; gap: 16px; }
      .main-nav { gap: 16px 24px; justify-content: flex-start; }
      .main-nav a { text-align: left; display: inline-block; }
    }

    /* === PAGE CONTENT STYLES === */
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px; text-align: center; }

    /* Hero */
    .hero { padding: 80px 0; border-top: none; }
    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1.1;
      margin: 0 0 16px 0;
      color: white;
      text-shadow: 0 0 20px rgba(255,215,0,0.2);
    }
    .kicker {
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 1.25rem;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto 30px auto;
    }
    
    /* Hero Photo - New AI SDR Profile Pic */
    .hero-photo { 
      margin: 40px auto; 
      width: 280px; 
      height: 280px; 
      border-radius: 50%; 
      overflow: hidden;
      border: 4px solid var(--accent);
      box-shadow: 0 0 25px rgba(255,215,0,0.5), 0 0 50px rgba(255,215,0,0.2);
      transition: all 0.3s ease;
    }
    .hero-photo:hover {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(255,215,0,0.7), 0 0 60px rgba(255,215,0,0.4);
    }
    .hero-photo img {
      width: 100%; 
      height: 100%; 
      object-fit: cover;
    }

    /* Buttons */
    .cta-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 28px; font-size: 1.05rem; font-weight: 700; border-radius: 12px;
      text-decoration: none; border: 1px solid transparent; transition: all 0.2s ease; cursor: pointer;
    }
    .btn-primary {
      background-color: var(--accent); color: #0b1220; border-color: var(--accent);
      box-shadow: 0 5px 15px rgba(255,215,0,0.3);
    }
    .btn-primary:hover {
      background-color: #fff; color: #0b1220; transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,215,0,0.5);
    }
    .btn-secondary {
      background-color: transparent; color: #fff; border-color: var(--card-border);
    }
    .btn-secondary:hover {
      background-color: #fff; color: #0b1220; transform: translateY(-2px);
      border-color: #fff;
    }

    /* Footer */
    .footer{border-top:1px solid var(--card-border);margin-top:40px;padding:32px 20px;text-align:center;color:var(--text-muted)}
    .socials{display:flex;gap:16px;justify-content:center;margin-top:16px}
    .socials a{color:#fff;transition:all .2s ease}
    .socials a:hover{color:var(--accent);transform:translateY(-2px);text-shadow:0 0 10px var(--accent)}
    .socials svg{width:24px;height:24px;fill:currentColor}
  </style>
</head>

<body>

  <header>
    <div class="header-center">
      <a class="brand" href="/">
         <img src="/assets/industry5logo.svg" alt="Industry5.pro logo" class="logo" width="75" height="75" loading="eager" decoding="async">
         <span class="title">Industry5.pro</span>
      </a>
      
      <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/ai">AI &<br>Omnichannel</a>
        <a href="/cyber">Security</a>
