<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Canonical for SEO/previews -->
  <link rel="canonical" href="https://industry5.pro/aiot/">

  <!-- 0-delay HTML redirect -->
  <meta http-equiv="refresh" content="0; url=/aiot/">

  <style>
    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#000;color:#fff}
    .wrap{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
    a{color:#85BB65}
  </style>

  <script>
    // JS redirect (keeps this page out of history)
    location.replace('/aiot/');
  </script>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Taking you to AIoT…</h1>
      <p>If you aren’t redirected, <a href="/aiot/">click here</a>.</p>
    </div>
  </div>

  <noscript>
    <meta http-equiv="refresh" content="0; url=/aiot/">
  </noscript>
</body>
</html>
