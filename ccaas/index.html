  <style id="master-header-ccaas">
    :root {
      --header-h: 76px;
      --genesys-orange: #FF6A13; /* Page theme color */
      --lumen-charcoal: #1B1B1D;
    }
    
    body { 
      padding-top: var(--header-h) !important; 
      background-color: var(--lumen-charcoal);
      color: #e8eef9;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial;
      margin: 0;
      box-sizing: border-box;
    }
    *, *:before, *:after { box-sizing: inherit; }
    main, .hero, .page-start { margin-top: 0 !important; }

    .topbar {
      position: fixed !important; top: 0; left: 0; right: 0;
      z-index: 99999 !important; height: var(--header-h);
      background: rgba(27,27,29,.95) !important;
      backdrop-filter: saturate(140%) blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center;
      overflow: visible !important;
    }
    .topbar .wrap {
      width: 100%; max-width: 1080px; margin: 0 auto;
      padding: 0 24px; height: 100%;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav { 
      display: flex; align-items: center; 
      width: 100%; height: 100%; 
    }

    .topbar .brand {
      display: flex; align-items: center; gap: 16px;
      margin-right: 2px !important; text-decoration: none; flex-shrink: 0; 
    }
    .topbar .brand .logo {
      height: 55px !important; width: 55px !important;
      display: block !important; object-fit: contain;
      /* GENESYS ORANGE GLOW */
      filter: drop-shadow(0 0 8px rgba(255,106,19,0.6)) !important; 
      transition: filter 0.3s ease;
    }
    .topbar .brand .logo:hover { 
      filter: drop-shadow(0 0 16px rgba(255,106,19,1)) !important; 
    }
    .topbar .brand strong {
      font-size: 18px; font-weight: 800; 
      color: #e8eef9 !important; white-space: nowrap;
    }
    
    .nav-actions {
      display: flex; align-items: center; gap: 20px;
      height: 44px;
      border-left: 1px solid rgba(255,255,255,.15);
      padding-left: 42px !important;
      padding-right: 40px !important;
      flex-grow: 1; justify-content: flex-end;
      overflow-x: auto; overflow-y: hidden;
      white-space: nowrap; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav-actions::-webkit-scrollbar { display: none; }
    
    .topbar .navlink {
      position: relative; display: inline-flex;
      align-items: center; justify-content: center; text-align: center;
      color: #ffffff !important; /* Default White */
      font-weight: 700;
      font-size: 14px; text-decoration: none;
      line-height: 1.2; padding: 4px 0;
      transition: all 0.2s ease;
      flex-shrink: 0;
      white-space: normal !important;
    }
    
    /* HOVER/ACTIVE: Force Genesys Orange */
    .topbar .navlink:hover,
    .topbar .navlink:focus-visible,
    .topbar .navlink[aria-current="page"] {
      color: var(--genesys-orange) !important;
      transform: translateY(-1px);
      text-shadow: 0 0 10px rgba(255,106,19,0.75), 0 0 20px rgba(255,106,19,0.45) !important;
      outline: 0;
    }
    
    @media (max-width: 900px) {
      .topbar .brand strong { display: none; } 
      .nav-actions { gap: 16px; padding-left: 16px !important; }
    }
  </style>
