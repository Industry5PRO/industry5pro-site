  <!-- === SEO === -->
  <title>Cloud 2.0 & NaaS Advisory (Lumen) | Industry5.pro</title>
  <meta name="description" content="Ditch legacy cloud costs. We are supplier-agnostic advisors for Cloud 2.0, specializing in Lumen NaaS, edge compute, and multi-cloud. We design for latency, cost, and resilience. Get your impact-first audit.">

  <!-- === MASTER HEADER STYLES (v5 Consolidated) === -->
  <style id="master-header-v5">
    :root {
      --header-h: 76px;
      --ice-blue: #2BEDE7;
      --lumen-charcoal: #1B1B1D;
    }
    
    body { 
      padding-top: var(--header-h) !important; 
      background-color: var(--lumen-charcoal);
      color: #e8eef9;
      /* This font matches your homepage */
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial;
      margin: 0;
      box-sizing: border-box;
    }
    *, *:before, *:after { box-sizing: inherit; }
    main, .hero, .page-start { margin-top: 0 !important; }

    .topbar {
      position: fixed !important;
      top: 0; left: 0; right: 0;
      z-index: 99999 !important;
      height: var(--header-h);
      background: rgba(27,27,29,0.95) !important;
      backdrop-filter: saturate(140%) blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      overflow: visible !important;
    }
    .topbar .wrap {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav { 
      display: flex; 
      align-items: center; 
      width: 100%; 
      height: 100%; 
    }

    .topbar .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-right: 2px !important; /* Final Divider Nudge */
      text-decoration: none;
      flex-shrink: 0;
    }
    .topbar .brand .logo {
      height: 55px !important;
      width: 55px !important;
      display: block !important;
      object-fit: contain;
      background: transparent !important;
      box-shadow: none !important;
      filter: drop-shadow(0 0 8px rgba(43,237,231,0.6)) !important; /* ICE BLUE GLOW */
      transition: filter 0.3s ease;
    }
    .topbar .brand .logo:hover {
      filter: drop-shadow(0 0 16px rgba(43,237,231,1)) !important;
    }
    .topbar .brand strong {
      font-size: 18px;
      font-weight: 800 !important;
      color: #e8eef9 !important;
      white-space: nowrap;
      text-shadow: none !important;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      height: 44px;
      border-left: 1px solid rgba(255,255,255,0.15);
      padding-left: 42px !important;   /* Final Divider Nudge */
      padding-right: 40px !important;  /* "Book Lou" Cutoff Fix */
      flex-grow: 1;
      justify-content: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav-actions::-webkit-scrollbar { display: none; }

    .topbar .navlink {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff !important;
      font-weight: 800 !important;
      font-size: 14px;
      text-decoration: none;
      line-height: 1.2 !important;
      white-space: normal !important; /* Allows <br> to work */
      padding: 4px 0;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    
    /* Force Ice Blue Hover (No Orange) */
    .topbar .navlink:hover,
    .topbar .navlink:focus-visible {
      color: var(--ice-blue) !important;
      transform: translateY(-1px);
      text-shadow: 0 0 10px rgba(43,237,231,0.75), 0 0 20px rgba(43,237,231,0.45) !important;
      outline: 0;
    }
    
    /* Active page link matches hover state */
    .topbar .navlink[aria-current="page"] {
      color: var(--ice-blue) !important;
      text-shadow: 0 0 10px rgba(43,237,231,0.75), 0 0 20px rgba(43,237,231,0.45) !important;
    }


    /* Kill any old pill/underline styles */
    .topbar .navlink::before, 
    .topbar .navlink::after { 
      content: none !important; 
      display: none !important; 
    }
    
    @media (max-width: 900px) {
      .topbar .brand strong { display: none; } 
      .nav-actions { gap: 16px; padding-left: 16px !important; }
    }
  </style>
