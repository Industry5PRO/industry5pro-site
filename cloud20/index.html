  <style>
    /* --- CORE VARIABLES (CLOUD 2.0 THEME: ICE BLUE) --- */
    :root {
      --bg: #1B1B1D;
      --panel: #232326;
      --card-bg: #0a0f1a; /* Slightly darker for Cloud page */
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #e8eef9;
      --text-muted: #aeb8c4;
      --line: rgba(255,255,255,0.08);
      --outline: #2C2C30;

      /* Page Specific Accents */
      --accent: #2BEDE7;           /* Lumen Ice Blue */
      --accent-secondary: #FF6A13; /* Lumen Orange */
      --gold: #FFD700;             /* Standard Gold (for Blog/SDR) */
    }
    
    /* --- RESET & BASE --- */
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial; box-sizing: border-box;}
    *, *:before, *:after { box-sizing: inherit; }
    a{color:inherit;text-decoration:none;transition:color .2s ease;}
    a:hover{text-decoration:none;}
    img{max-width:100%;display:block}
    button{font-family:inherit;}
    section{padding:42px 0;border-top:1px solid var(--outline)}
    section:first-of-type { border-top: none; }
    .anchor{scroll-margin-top:90px}

    /* --- 3. MASTER HEADER & NAV --- */
    header {
      position: sticky; top: 0; z-index: 99999;
      background: linear-gradient(180deg,rgba(27,27,29,0.95),rgba(27,27,29,0.85));
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    
    .header-center {
      max-width: 1100px; 
      margin: 0 auto; 
      padding: 14px 18px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 20px; 
    }

    /* Branding */
    .brand { display: flex; align-items: center; gap: 16px; text-decoration: none; flex-shrink: 0; }
    
    /* LOGO: 75px + ICE BLUE GLOW */
    .brand img.logo {
      width: 75px !important; height: 75px !important; 
      border-radius: 14px; display: block; object-fit: contain; 
      background: transparent;
      filter: drop-shadow(0 0 8px rgba(43, 237, 231, 0.5));
      transition: filter 0.3s ease;
    }
    .brand:hover img.logo { filter: drop-shadow(0 0 14px rgba(43, 237, 231, 0.9)); }
    
    .brand .title {
      font-weight: 800; 
      font-size: 26px; 
      color: #fff; line-height: 1; letter-spacing: 0.2px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, 'Helvetica Neue', Arial;
    }

    /* Navigation */
    .main-nav { 
      display: flex; gap: 20px; align-items: center; flex-wrap: wrap; 
      justify-content: flex-end; 
    }

    /* Nav Links */
    .main-nav a {
      position: relative; color: #cfe3d4; 
      font-weight: 500; 
      font-size: 0.85rem; 
      line-height: 1.2; text-align: center; display: inline-flex; 
      align-items: center; justify-content: center;
      transition: color .15s ease, text-shadow .15s ease;
    }

    /* Page Specific Active State (Cloud 2.0) */
    .main-nav a.active {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(43, 237, 231, 0.6);
    }

    /* Hover Effects */
    .main-nav a:not(.nav-sdr):hover {
      color: var(--accent); /* Ice Blue Hover */
      text-shadow: 0 0 6px rgba(43, 237, 231, 0.85), 0 0 14px rgba(43, 237, 231, 0.45);
    }

    /* Underline Animation */
    .main-nav a:not(.nav-sdr)::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 2px;
      background: var(--accent); 
      transform: scaleX(0); transform-origin: left; 
      transition: transform .25s ease;
    }
    .main-nav a:not(.nav-sdr):hover::after { transform: scaleX(1); }
    .main-nav a.active::after { transform: scaleX(1); }

    /* --- AI SDR SPECIAL BUTTON --- */
    .main-nav a.nav-sdr {
      color: #fff !important;
      font-weight: 800;
      text-transform: uppercase;
      border: none;
      background: transparent;
      padding: 6px 4px;
      transition: all 0.25s ease;
    }
    
    .main-nav a.nav-sdr:hover {
      color: var(--gold) !important;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      transform: translateY(-1px);
    }

    @media (max-width: 1100px) {
      .header-center { flex-direction: column; align-items: flex-start; gap: 16px; }
      .main-nav { gap: 16px 24px; justify-content: flex-start; }
      .main-nav a { text-align: left; display: inline-block; }
    }

    /* === PAGE CONTENT STYLES === */
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    /* Hero */
    .hero { padding: 40px 0 10px; border-top: none; }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 40px;
      align-items: center;
    }
    
    .kicker {
      color: var(--accent-secondary); /* Lumen Orange */
      font-weight: 700;
      font-size: .95rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 4.5vw, 3rem);
      line-height: 1.15;
      margin: 0 0 14px;
      color: #fff;
    }

    .lead {
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      color: #d5dcef;
      margin: 0 0 24px;
      max-width: 650px;
    }

    .hero-pic {
      justify-self: end;
      width: 100%;
      max-width: 340px;
      border-radius: 18px;
      overflow: hidden;
    }
    .hero-pic img { display: block; width: 100%; border-radius: 18px; }

    @media (max-width:980px){ 
      .hero-grid { grid-template-columns: 1fr; } 
      .hero-pic { display: none; } 
    }

    /* Buttons */
    .cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 24px; font-size: 1rem; font-weight: 700;
      border-radius: 12px; text-decoration: none; border: 1px solid transparent;
      transition: all 0.2s ease; cursor: pointer;
    }
